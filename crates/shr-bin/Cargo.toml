[package]
name = "shr-bin"
description = "shr-rs entry point: TUI with no arguments, CLI otherwise"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "shr-rs"
path = "src/main.rs"

[dependencies]
shr-command = { path = "../shr-command" }
shr-cli = { path = "../shr-cli" }
shr-tui = { path = "../shr-tui" }
anyhow = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
