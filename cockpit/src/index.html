<!-- `lang` is the source language, not the rendered one: index.tsx replaces
     it with `cockpit.language` once po.js has been applied. -->
<html lang="en">
<head>
    <title>SHR-RS RAID Manager</title>
    <meta charset="utf-8">
    <meta name="description" content="SHR-RS mdadm storage dashboard">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="index.css">
    <link href="../../static/branding.css" rel="stylesheet" />

    <script type="text/javascript" src="../base1/cockpit.js"></script>
    <!-- Both must sit between cockpit.js and index.js: they call
         `cockpit.locale()`, and index.js reads translations from module scope
         onward.
         `po-default.js` is the English catalogue, served verbatim to every
         session. It is the baseline because this package's msgids are dotted
         keys rather than English sentences, and cockpit-ws sends an empty
         body for `po.js` in any session it considers untranslated (English
         included) -- see build.js for the measurements.
         `po.js` is then the session language's catalogue, if one exists.
         `cockpit.locale()` merges, so Korean lands on top of English and any
         string a translation has not covered still reads as English. -->
    <script type="text/javascript" src="po-default.js"></script>
    <script type="text/javascript" src="po.js"></script>
    <script type="text/javascript" src="index.js"></script>
</head>

<body>
    <div id="app"></div>
</body>
</html>
